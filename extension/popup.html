<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>保存到学习中心</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3-1 3 15-3 1z"/></svg>
      </span>
      <div class="brand-copy">
        <h1>学习中心</h1>
        <span id="conn-status" class="status-dot">连接中…</span>
      </div>
    </div>
    <button type="button" id="open-app" class="ghost-btn" title="打开学习中心">工作台 ↗</button>
  </header>

  <div id="existing-banner" class="banner" hidden>
    <span id="existing-text"></span>
    <button type="button" id="open-existing" class="link-btn">打开阅读 ↗</button>
  </div>

  <form id="capture">
    <section class="card">
      <div class="page-meta">
        <span id="page-type" class="pill">网页文章</span>
        <span id="page-host" class="host"></span>
      </div>
      <label class="field">
        <span>标题</span>
        <input id="title-input" name="title" type="text" maxlength="500" placeholder="资料标题" required>
      </label>
      <div id="mode-switch" class="mode-switch" role="group" aria-label="提取范围" hidden>
        <button type="button" class="seg active" data-mode="full" aria-pressed="true">整页正文</button>
        <button type="button" class="seg" data-mode="selection" aria-pressed="false" id="mode-selection-btn">选中内容</button>
      </div>
      <p id="capture-preview" class="preview"></p>
    </section>

    <section class="card">
      <div class="section-head">
        <span class="label">保存到圈子</span>
        <button type="button" id="toggle-new-circle" class="link-btn">+ 新建圈子</button>
      </div>
      <div id="new-circle-row" class="inline-create" hidden>
        <input id="new-circle-name" type="text" maxlength="60" placeholder="输入圈子名称">
        <button type="button" id="create-circle-btn" class="mini-btn">创建</button>
      </div>
      <div id="circles" class="circle-list"></div>
    </section>

    <section class="card compact">
      <div class="section-head">
        <span class="label">学习状态</span>
        <div class="state-group" role="group" aria-label="学习状态">
          <button type="button" class="state-chip active" data-state="inbox" aria-pressed="true">待读</button>
          <button type="button" class="state-chip" data-state="learning" aria-pressed="false">学习中</button>
          <button type="button" class="state-chip" data-state="mastered" aria-pressed="false">已掌握</button>
        </div>
      </div>
      <label class="field note-field">
        <input id="note-input" name="note" type="text" maxlength="5000" placeholder="顺手记一句想法（可选）">
      </label>
    </section>

    <button id="save" class="primary-btn" disabled>保存到学习中心</button>
  </form>

  <div id="result-bar" class="result-bar" hidden>
    <p id="message" role="status" aria-live="polite"></p>
    <button type="button" id="open-saved" class="link-btn" hidden>去阅读 ↗</button>
  </div>

  <details id="settings-box">
    <summary>连接设置与快捷键</summary>
    <form id="settings">
      <label class="field">
        <span>本地服务地址</span>
        <input name="endpoint" type="url" required placeholder="http://127.0.0.1:3000">
      </label>
      <label class="field">
        <span>访问令牌（可选）</span>
        <input name="token" type="password" autocomplete="off" placeholder="设置了 ACCESS_TOKEN 时填写">
      </label>
      <button class="secondary-btn">更新连接</button>
      <p class="hint">提示：右键任意网页或选中文本可一键静默剪藏；快捷键默认为 <code>⌘/Alt + Shift + S</code>。</p>
    </form>
  </details>
</body>
</html>
